name: Build release APK

on:
  push:
    branches: [feature/custom-default-page, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Recent Android command-line tools require JDK 11+ to run, so use JDK 17
      # just for installing SDK packages.
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 28 + build-tools 28.0.3
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      # Lawnchair V1 toolchain (Gradle 5.5.1 / AGP 3.4.2) must build on JDK 8.
      # This step runs last so JAVA_HOME points at JDK 8 for the Gradle build.
      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Build quickstepLawnchair release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleQuickstepLawnchairRelease --stacktrace --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lawndesk-release-apk
          path: build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk -path '*release*' -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "Release APK not found"; exit 1; }
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' build.gradle | head -n1)"
          [ -n "$VERSION" ] || VERSION="1.0"
          TAG="v${VERSION}.${GITHUB_RUN_NUMBER}"
          OUT_APK="Lawndesk-${TAG}.apk"
          cp "$APK" "$OUT_APK"
          PRE=""
          if [ "${GITHUB_REF_NAME}" != "master" ]; then PRE="--prerelease"; fi
          gh release create "$TAG" "$OUT_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lawndesk $TAG (${GITHUB_REF_NAME})" \
            --notes "Built by GitHub Actions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --generate-notes $PRE
          echo "Published release $TAG with $OUT_APK"
